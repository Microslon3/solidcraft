name: Mesh orbit at the section boundary
on:
  push:
    branches: [codex/review-checks-20290-20292]
    paths: ['.github/workflows/review-mesh-clip-start.yml', 'mesh-clip-start.patch', 'mesh-clip-start-tree.txt']
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Complete pre-commit gate for mesh geometry and UI', os: ubuntu-24.04, kind: fast }
          - { name: 'Native Windows executable', os: windows-latest, kind: winbuild }
          - { name: 'Windows navigation and mesh picking tests', os: windows-latest, kind: wintest }
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_CI_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_GOLDENS_DEBUG: 0
      CARGO_PROFILE_GOLDENS_INCREMENTAL: 'false'
      CARGO_BUILD_JOBS: 3
      RUST_MIN_STACK: 8388608
      NEXTEST_TEST_THREADS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Microslon3/solidcraft
          ref: fbb008fd4158927d73d8aa7621146f298a9ef28d
          path: source
          persist-credentials: false
      - name: Verify the tested source tree and SolidCore revision
        working-directory: source
        shell: bash
        run: |
          git -C ../proof cat-file blob HEAD:mesh-clip-start.patch > "$RUNNER_TEMP/mesh-clip-start.patch"
          git apply --cached "$RUNNER_TEMP/mesh-clip-start.patch"
          git diff --cached --name-only -z | git checkout-index -f -z --stdin
          git diff --quiet
          git diff --cached --check
          git diff --cached --stat
          tree=$(git write-tree)
          echo "Git tree $tree"
          test "$tree" = "$(git -C ../proof show HEAD:mesh-clip-start-tree.txt)"
          echo "SolidCore tree $(git rev-parse "$tree:solidcore")"
          test "$(git rev-parse "$tree:solidcore")" = "$(git rev-parse HEAD:solidcore)"
      - name: Select the project toolchain
        working-directory: source
        run: rustup show active-toolchain
      - name: Install Linux build and software graphics dependencies
        if: matrix.kind == 'fast'
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        if: matrix.kind == 'fast'
        with:
          tool: cargo-nextest@0.9.150
      - name: Run the complete pre-commit gate for the follow-up
        if: matrix.kind == 'fast'
        working-directory: source
        run: cargo xtask fast --base HEAD
      - name: Build the native Windows app
        if: matrix.kind == 'winbuild'
        working-directory: source
        env:
          SOLIDCRAFT_VERSION: 0.45.0
        run: cargo build --locked --profile ci -p solidcraft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.kind == 'winbuild'
        with:
          name: solidcraft-windows-mesh-clip-start
          path: source/target/ci/solidcraft.exe
          if-no-files-found: error
          retention-days: 2
      - name: Check both mesh-picking paths, navigation and device handover on Windows
        if: matrix.kind == 'wintest'
        working-directory: source
        run: >-
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib -- navigation:: view_pick::tests:: viewport_middle_ middle_click_on_chamfer_distance_keeps_primary_selection_paste another_device_starts_with_no_buttons_seen_and_no_settling
