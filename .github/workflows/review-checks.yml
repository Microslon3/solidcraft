name: SolidCraft review checks
on:
  push:
    branches: [codex/review-checks-20290-20292]
    paths: ['.github/workflows/review-checks.yml', '*.patch', 'base.txt']
permissions:
  contents: read
jobs:
  verify:
    name: PR ${{ matrix.pr }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pr: [20290]
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_CI_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 3
      RUST_MIN_STACK: 8388608
      NEXTEST_TEST_THREADS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - name: Read the upstream revision
        id: base
        shell: bash
        run: echo "sha=$(cat proof/base.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tangency-labs/solidcraft
          ref: ${{ steps.base.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Apply only the changes for this PR
        shell: bash
        working-directory: source
        run: |
          git apply --check ../proof/${{ matrix.pr }}.patch
          git apply ../proof/${{ matrix.pr }}.patch
          git diff --check
          git diff --stat
      - name: Select the project's Rust toolchain
        working-directory: source
        run: rustup show active-toolchain
      - name: Install Linux build and software graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        if: runner.os == 'Linux'
        with:
          tool: cargo-nextest@0.9.150
      - name: Check the update dialog on Linux
        if: runner.os == 'Linux'
        working-directory: source
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib update::tests::
      - name: Build the native Windows app for the isolated visual reproduction
        if: runner.os == 'Windows'
        working-directory: source
        env:
          SOLIDCRAFT_VERSION: 0.45.0
        run: cargo build --locked --profile ci -p solidcraft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Windows'
        with:
          name: solidcraft-windows-${{ matrix.pr }}
          path: source/target/ci/solidcraft.exe
          if-no-files-found: error
          retention-days: 1
      - name: Check the updater and its translated buttons on Windows
        if: runner.os == 'Windows' && matrix.pr == 20290
        working-directory: source
        shell: bash
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-kit --lib a_wrapping_footer_keeps_the_native_actions_at_wide_and_narrow_widths
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib update::tests::
      - name: Check the navigation module on Windows
        if: runner.os == 'Windows' && matrix.pr == 20292
        working-directory: source
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib navigation::
