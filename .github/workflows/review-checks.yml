name: SolidCraft review checks
on:
  push:
    branches: [codex/review-checks-20290-20292]
    paths: ['.github/workflows/review-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    name: PR ${{ matrix.pr }} on published head
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 20290
            head: 9bd24319f08dc0b65505fdc0f00462bcddd7cf3a
          - pr: 20292
            head: 78393d41662a95e9d4617cea50780dbaa6fc99f6
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_CI_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 3
      RUST_MIN_STACK: 8388608
      NEXTEST_TEST_THREADS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm the published revision and its upstream parent
        env:
          EXPECTED_HEAD: ${{ matrix.head }}
          UPSTREAM_PARENT: ce021bd5178b468c745fc3f589b27247632dd7e6
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$UPSTREAM_PARENT"
          git diff --check HEAD^ HEAD
          git show --oneline --stat HEAD
      - name: Select the project's Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux build and software graphics dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.150
      - name: Run the project's pre-commit gate on this PR head
        run: cargo xtask fast --base HEAD^
