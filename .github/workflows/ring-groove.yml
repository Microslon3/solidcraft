name: Ring groove review
on:
  push:
    branches: [codex/19624-evidence]
    paths: ['candidate.patch', 'source-base.txt', 'source-tree.txt', '.github/workflows/ring-groove.yml', 'cases/**']
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: static, job: 'Clippy, WebAssembly and repository checks', os: ubuntu-24.04 }
          - { kind: app, job: 'Application kernel tests', os: ubuntu-24.04 }
          - { kind: core, job: 'SolidCore tests 1 of 3', os: ubuntu-24.04, part: '1/3' }
          - { kind: core, job: 'SolidCore tests 2 of 3', os: ubuntu-24.04, part: '2/3' }
          - { kind: core, job: 'SolidCore tests 3 of 3', os: ubuntu-24.04, part: '3/3' }
          - { kind: goldens, job: 'FeatureExecutive and B-rep reference geometry', os: ubuntu-24.04 }
          - { kind: windows, job: 'Windows desktop build and Delete Face reproductions', os: windows-latest }
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_CI_DEBUG: 0
      CARGO_PROFILE_GOLDENS_DEBUG: 0
      CARGO_PROFILE_GOLDENS_INCREMENTAL: 'false'
      RUST_MIN_STACK: 8388608
      NEXTEST_TEST_THREADS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - name: Read the upstream base
        id: base
        shell: bash
        run: echo "sha=$(git -C proof show HEAD:source-base.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          repository: tangency-labs/solidcraft
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
      - name: Verify the exact source tree under test
        working-directory: source
        shell: bash
        run: |
          git -C ../proof cat-file blob HEAD:candidate.patch > "$RUNNER_TEMP/ring.patch"
          git apply --cached "$RUNNER_TEMP/ring.patch"
          git diff --cached --name-only -z | git checkout-index -f -z --stdin
          git diff --quiet
          git diff --cached --check
          tree=$(git write-tree)
          echo "Git tree $tree"
          test "$tree" = "$(git -C ../proof show HEAD:source-tree.txt)"
      - name: Use the repository toolchain
        working-directory: source
        run: rustup show active-toolchain
      - name: Install Linux build dependencies
        if: matrix.kind == 'app' || matrix.kind == 'static'
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        if: matrix.kind == 'app' || matrix.kind == 'core' || matrix.kind == 'static'
        with:
          tool: cargo-nextest@0.9.150
      - name: Check out the pinned kernel test data
        if: matrix.kind == 'core' || matrix.kind == 'goldens'
        working-directory: source/solidcore
        run: |
          source scripts/upstream-pin.env
          git init -q upstream
          git -C upstream remote add origin "$UPSTREAM_REPO"
          git -C upstream sparse-checkout set --no-cone '/TestFiles/pt_TestFiles/'
          git -C upstream fetch --no-tags --filter=blob:none --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test -s upstream/TestFiles/pt_TestFiles/Surface.sms
          echo "SOLIDCORE_REQUIRE_UPSTREAM=1" >> "$GITHUB_ENV"
      - name: Check both workspaces and the WebAssembly target
        if: matrix.kind == 'static'
        working-directory: source
        run: cargo xtask fast --base HEAD --no-tests
      - name: Run application kernel tests and the upstream regression grader
        if: matrix.kind == 'app'
        working-directory: source
        run: |
          status=0
          cargo nextest run --locked --cargo-profile ci --profile ci --no-fail-fast -p solidcraft-kernel || status=$?
          if [[ "$status" != 0 && "$status" != 100 ]]; then exit "$status"; fi
          junit=target/nextest/ci/junit.xml
          test -s "$junit"
          cargo xtask known-failing --junit "$junit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.kind == 'app'
        with:
          name: application-kernel-junit
          path: source/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7
      - name: Run SolidCore tests
        if: matrix.kind == 'core'
        working-directory: source/solidcore
        run: >-
          cargo nextest run --locked --cargo-profile goldens --no-fail-fast --partition hash:${{ matrix.part }}
          -p diagnostics -p nurbs-grid-mesh -p solidcore -p solidcore-cadir -p solidcore-convert
          -p solidcore-ops -p solidcore-record -p solidcore-ssi -p solidcore-step
          -p solidcore-tess -p ssi -p step-export -p xtask
      - name: Check the kernel unit against its goldens
        if: matrix.kind == 'goldens'
        working-directory: source/solidcore
        run: cargo run --locked --profile goldens -p goldens -- --unit blend.feature_executive --unit topology.brep_p5 --goldens
      - name: Build the native desktop and command-line applications
        if: matrix.kind == 'windows'
        working-directory: source
        run: cargo build --locked --profile ci -p solidcraft -p solidcraft-cli
      - name: Use Delete Face on each model
        if: matrix.kind == 'windows'
        shell: bash
        run: python proof/cases/check_app.py --cli "$PWD/source/target/ci/solidcraft-cli.exe" --out "$PWD/results" --expect fixed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && matrix.kind == 'windows'
        with:
          name: ring-groove-windows-results
          path: |
            results/*.json
            source/target/ci/solidcraft.exe
          if-no-files-found: error
          retention-days: 3
